<div id="edit-music" class="edit-panel-container">
    <!-- Row 1: Instruments -->
    <div class="edit-row">
      <div class="edit-label">Instruments</div>
      <div class="edit-options">
        <button class="edit-btn instrument-btn">Guitar</button>
        <button class="edit-btn instrument-btn">Piano</button>
        <button class="edit-btn instrument-btn">Violin</button>
        <button class="edit-btn instrument-btn">Drums</button>
      </div>
    </div>
  
    <!-- Row 2: Genre -->
    <div class="edit-row">
      <div class="edit-label">Genre</div>
      <div class="edit-options">
        <button class="edit-btn genre-btn" data-genre="Indie Pop">Pop</button>
        <button class="edit-btn genre-btn" data-genre="Indie Folk">Folk</button>
        <button class="edit-btn genre-btn" data-genre="Alternative Country">Country</button>
        <button class="edit-btn genre-btn" data-genre="Indie Rock">Rock</button>
      </div>
    </div>
  
    <!-- Row 3: Tempo -->
    <div class="edit-row">
      <div class="edit-label">Tempo</div>
      <div class="edit-options">
        <input type="range" id="tempo-slider" min="40" max="200" value="80">
        <p id="tempo-value">80</p>
      </div>
    </div>
  
    <!-- Row 4: Intensity -->
    <div class="edit-row">
      <div class="edit-label">Intensity</div>
      <div class="edit-options">
        <input type="range" id="intensity-slider" min="0" max="100" value="80">
        <p id="intensity-value">80%</p>
      </div>
    </div>
  </div>
