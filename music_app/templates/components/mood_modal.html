<button id="face-icon" class="icon face-icon">
    <img src="{{ url_for('static', filename='images/face-emotion.png') }}" alt="face emotion button">
</button>

<div id="mood-modal" class="mood-modal">
    <div class="modal-content">
        <h2>Mood</h2>
        <div class="emoji-grid">
            <!-- Mood emojis -->
            <button class="btn emoji-btn" data-mood="Happy 😊">😀</button>
            <button class="btn emoji-btn" data-mood="Calm 🧘">😌</button>
            <button class="btn emoji-btn" data-mood="Stressed 😖">😖</button>
            <button class="btn emoji-btn" data-mood="Sad 😢">😢</button>
        </div>

        <h3>Choose a style</h3>
        <div class="style-grid">
          <button class="btn style-btn" data-style="Upbeat, playful rhythms">Upbeat</button>
          <button class="btn style-btn" data-style="Calm, contented sound">Calm</button>
          <button class="btn style-btn" data-style="Soft, rhythmic melodies">Soft</button>
          <button class="btn style-btn" data-style="Warm, reflective tones">Reflective</button>
        </div>

        <div class="modal-actions">
          <button class="btn cancel-btn">Cancel</button>
          <button class="btn confirm-play-btn">Play New Song</button>
        </div>
    </div>
</div>
